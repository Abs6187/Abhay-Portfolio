<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Server Error - Abhay Gupta Portfolio</title>
    <meta name="description" content="Something went wrong on our end. Please try again later." />
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" />
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Poppins', sans-serif; background: #101418; color: #e0e0e0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; }
        .error-code { font-size: clamp(6rem, 20vw, 10rem); font-weight: 800; color: #FF4500; line-height: 1; margin-bottom: 8px; letter-spacing: -4px; animation: pulse 2s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        h1 { font-size: 1.8rem; color: #fff; margin-bottom: 12px; }
        p { color: #888; max-width: 440px; margin-bottom: 36px; font-size: 1rem; line-height: 1.7; }
        .btn-group { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
        .btn { padding: 12px 28px; border-radius: 10px; font-family: 'Poppins', sans-serif; font-size: 0.95rem; font-weight: 600; text-decoration: none; transition: all 0.2s; }
        .btn-primary { background: #FF4500; color: #fff; border: 2px solid #FF4500; }
        .btn-primary:hover { background: #cc3700; border-color: #cc3700; }
        .btn-outline { background: transparent; color: #ccc; border: 2px solid #333; }
        .btn-outline:hover { border-color: #FF4500; color: #FF4500; }
        .status-box { background: rgba(255,69,0,0.08); border: 1px solid rgba(255,69,0,0.2); border-radius: 12px; padding: 14px 24px; margin-bottom: 30px; display: inline-block; }
        .status-box p { color: #FF4500; font-size: 0.85rem; margin: 0; }
    </style>
</head>
<body>
    <div class="error-code">500</div>
    <h1>Internal Server Error</h1>
    <div class="status-box">
        <p>Something went wrong on our end. This is not your fault.</p>
    </div>
    <p>The server encountered an unexpected error and couldn't complete your request. Please try again in a few moments. If the problem persists, reach out directly.</p>
    <div class="btn-group">
        <a href="/" class="btn btn-primary">Go Home</a>
        <a href="/contact.html" class="btn btn-outline">Report Issue</a>
    </div>
</body>
</html>
